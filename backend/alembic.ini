# Alembic configuration for CompliAGL.
#
# The database URL is resolved at runtime from application settings
# (app.core.config.settings.DATABASE_URL) in migrations/env.py, so the
# static sqlalchemy.url below is only a placeholder/fallback.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./compliagl.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
