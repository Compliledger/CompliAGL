<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="CompliAGL execution governance workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f24"/><stop offset="1" stop-color="#111a3a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="450" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Execution Governance Workflow</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    <g><rect x="330" y="70" width="240" height="42" rx="9" fill="#0e1733" stroke="#334155"/><text x="450" y="96">Actor · Intent · Target · Context</text></g>
    <g><rect x="330" y="132" width="240" height="42" rx="9" fill="#0e1733" stroke="#334155"/><text x="450" y="158">Governance Resolution</text></g>
    <g><rect x="330" y="194" width="240" height="42" rx="9" fill="#0e1733" stroke="#334155"/><text x="450" y="220">Evidence Lifecycle</text></g>
    <g><rect x="330" y="256" width="240" height="42" rx="9" fill="#0e1733" stroke="#334155"/><text x="450" y="282">Control Evaluation · Assessment</text></g>
    <g><rect x="330" y="318" width="240" height="46" rx="9" fill="#12203f" stroke="url(#accent)" stroke-width="2"/><text x="450" y="346" fill="#f8fafc" font-weight="600">Deterministic Decision</text></g>

    <!-- approved path -->
    <g><rect x="620" y="320" width="240" height="42" rx="9" fill="#0e2a22" stroke="#22c55e"/><text x="740" y="346" fill="#bbf7d0">APPROVED → Authorization</text></g>
    <!-- unresolved path -->
    <g><rect x="40" y="320" width="240" height="42" rx="9" fill="#2a1620" stroke="#f97316"/><text x="160" y="340" fill="#fed7aa">DENIED · ESCALATED</text><text x="160" y="356" fill="#fed7aa">MANUAL · NOT EVALUABLE</text></g>
    <g><rect x="40" y="386" width="240" height="42" rx="9" fill="#0e1733" stroke="#334155"/><text x="160" y="406">Findings · Remediation</text><text x="160" y="420" font-size="11" fill="#94a3b8">DevSync · Re-Assessment</text></g>

    <!-- execution -->
    <g><rect x="620" y="386" width="240" height="42" rx="9" fill="#0e1733" stroke="#334155"/><text x="740" y="412">External Execution</text></g>
    <g><rect x="620" y="448" width="240" height="42" rx="9" fill="#12203f" stroke="url(#accent)"/><text x="740" y="468">Execution Result → AIProof</text><text x="740" y="482" font-size="11" fill="#94a3b8">→ CompliLedger Proof</text></g>
  </g>

  <g stroke="url(#accent)" stroke-width="2" fill="none">
    <line x1="450" y1="112" x2="450" y2="130" marker-end="url(#a)"/>
    <line x1="450" y1="174" x2="450" y2="192" marker-end="url(#a)"/>
    <line x1="450" y1="236" x2="450" y2="254" marker-end="url(#a)"/>
    <line x1="450" y1="298" x2="450" y2="316" marker-end="url(#a)"/>
    <line x1="570" y1="341" x2="618" y2="341" marker-end="url(#a)"/>
    <line x1="330" y1="341" x2="282" y2="341" marker-end="url(#a)"/>
    <line x1="160" y1="362" x2="160" y2="384" marker-end="url(#a)"/>
    <line x1="740" y1="362" x2="740" y2="384" marker-end="url(#a)"/>
    <line x1="740" y1="428" x2="740" y2="446" marker-end="url(#a)"/>
  </g>
  <!-- remediation loop back -->
  <path d="M160 428 L160 470 L300 470 L300 341 L330 341" stroke="#f97316" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="230" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">re-decision</text>
</svg>
