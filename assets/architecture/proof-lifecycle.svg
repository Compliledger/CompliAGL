<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="CompliAGL AIProof and proof lifecycle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f24"/><stop offset="1" stop-color="#111a3a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1000" height="240" fill="url(#bg)"/>
  <text x="500" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">AIProof Lifecycle</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#cbd5e1" text-anchor="middle">
    <g><rect x="30" y="90" width="150" height="70" rx="10" fill="#12203f" stroke="url(#accent)"/><text x="105" y="120" fill="#e2e8f0" font-weight="600">Execution</text><text x="105" y="138">Result</text></g>
    <g><rect x="215" y="90" width="150" height="70" rx="10" fill="#0e1733" stroke="#334155"/><text x="290" y="120">Canonicalize</text><text x="290" y="138" font-size="11" fill="#94a3b8">RFC 8785 JCS</text></g>
    <g><rect x="400" y="90" width="150" height="70" rx="10" fill="#0e1733" stroke="#334155"/><text x="475" y="120">Hash</text><text x="475" y="138" font-size="11" fill="#94a3b8">SHA-256</text></g>
    <g><rect x="585" y="90" width="150" height="70" rx="10" fill="#0e1733" stroke="#334155"/><text x="660" y="120">Sign</text><text x="660" y="138" font-size="11" fill="#94a3b8">HMAC-SHA256*</text></g>
    <g><rect x="770" y="90" width="200" height="70" rx="10" fill="#141033" stroke="#6366f1"/><text x="870" y="116" fill="#c7d2fe" font-weight="600">CompliLedger Handoff</text><text x="870" y="136" font-size="11" fill="#94a3b8">local verify · anchor-ready</text></g>
  </g>
  <g stroke="url(#accent)" stroke-width="2" fill="none">
    <line x1="180" y1="125" x2="213" y2="125" marker-end="url(#a)"/>
    <line x1="365" y1="125" x2="398" y2="125" marker-end="url(#a)"/>
    <line x1="550" y1="125" x2="583" y2="125" marker-end="url(#a)"/>
    <line x1="735" y1="125" x2="768" y2="125" marker-end="url(#a)"/>
  </g>
  <text x="500" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">* Default signer is deterministic HMAC-SHA256 (swappable for asymmetric). On-chain anchoring is adapter-ready and optional.</text>
</svg>
