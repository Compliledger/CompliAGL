<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="CompliAGL execution governance boundary">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f24"/><stop offset="1" stop-color="#111a3a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">The Governance Boundary</text>
  <text x="500" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">CompliAGL decides whether an action may execute. External systems perform it.</text>

  <!-- left: autonomous intent -->
  <rect x="40" y="120" width="230" height="220" rx="12" fill="#0e1733" stroke="#334155"/>
  <text x="155" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Autonomous Intent</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    <text x="155" y="185">AI agents</text><text x="155" y="212">Enterprise apps</text>
    <text x="155" y="239">Workflow engines</text><text x="155" y="266">MCP tools</text>
    <text x="155" y="293">Smart contracts</text>
  </g>

  <!-- center: CompliAGL -->
  <rect x="385" y="110" width="230" height="240" rx="14" fill="#12203f" stroke="url(#accent)" stroke-width="2"/>
  <text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">CompliAGL</text>
  <text x="500" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22d3ee">Deterministic Governance</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#cbd5e1" text-anchor="middle">
    <text x="500" y="200">Policy resolution</text><text x="500" y="227">Evidence lifecycle</text>
    <text x="500" y="254">Control evaluation</text><text x="500" y="281">Deterministic decision</text>
    <text x="500" y="308">Execution authorization</text>
  </g>

  <!-- right: external execution -->
  <rect x="730" y="120" width="230" height="220" rx="12" fill="#0e1733" stroke="#334155"/>
  <text x="845" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">External Execution</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    <text x="845" y="185">Merchant / airline APIs</text><text x="845" y="212">Wallets &amp; payment rails</text>
    <text x="845" y="239">Hedera Agent Accounts</text><text x="845" y="266">Cloud services</text>
    <text x="845" y="293">Settlement / fulfilment</text>
  </g>

  <g stroke="url(#accent)" stroke-width="2.5" fill="none">
    <line x1="270" y1="230" x2="383" y2="230" marker-end="url(#a)"/>
    <line x1="615" y1="230" x2="728" y2="230" marker-end="url(#a)"/>
  </g>
  <text x="326" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">proposes</text>
  <text x="672" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">authorizes</text>

  <text x="500" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Execution result returns to CompliAGL → AIProof → CompliLedger Proof Infrastructure</text>
</svg>
