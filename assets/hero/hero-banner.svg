<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="CompliAGL — Deterministic Execution Governance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="0.55" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#0a0f24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <g stroke="#1e2a52" stroke-width="1" opacity="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
  </g>

  <text x="60" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">Compli<tspan fill="url(#accent)">AGL</tspan></text>
  <text x="62" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">AI Execution Governance Infrastructure</text>
  <text x="62" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748b">Govern before execution — evidence-backed, deterministic, provable.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    <g>
      <rect x="60"  y="250" width="150" height="60" rx="10" fill="#0e1733" stroke="#334155"/>
      <text x="135" y="276">Autonomous</text><text x="135" y="294">System</text>
    </g>
    <g>
      <rect x="255" y="250" width="170" height="60" rx="10" fill="#12203f" stroke="url(#accent)"/>
      <text x="340" y="276" fill="#e2e8f0" font-weight="600">CompliAGL</text><text x="340" y="294">Governance</text>
    </g>
    <g>
      <rect x="470" y="250" width="170" height="60" rx="10" fill="#0e1733" stroke="#334155"/>
      <text x="555" y="276">Execution</text><text x="555" y="294">Authorization</text>
    </g>
    <g>
      <rect x="685" y="250" width="160" height="60" rx="10" fill="#0e1733" stroke="#334155"/>
      <text x="765" y="276">External</text><text x="765" y="294">Execution</text>
    </g>
    <g>
      <rect x="890" y="250" width="110" height="60" rx="10" fill="#0e1733" stroke="#334155"/>
      <text x="945" y="284" fill="#e2e8f0" font-weight="600">AIProof</text>
    </g>
    <g>
      <rect x="1045" y="250" width="95" height="60" rx="10" fill="#12203f" stroke="url(#accent)"/>
      <text x="1092" y="276">CompliLedger</text><text x="1092" y="294">Proof</text>
    </g>
    <g stroke="url(#accent)" stroke-width="2" fill="none">
      <line x1="210" y1="280" x2="253" y2="280" marker-end="url(#arrow)"/>
      <line x1="425" y1="280" x2="468" y2="280" marker-end="url(#arrow)"/>
      <line x1="640" y1="280" x2="683" y2="280" marker-end="url(#arrow)"/>
      <line x1="845" y1="280" x2="888" y2="280" marker-end="url(#arrow)"/>
      <line x1="1000" y1="280" x2="1043" y2="280" marker-end="url(#arrow)"/>
    </g>
  </g>

  <circle cx="1080" cy="90" r="70" fill="url(#accent)" opacity="0.12" filter="url(#soft)"/>
</svg>
